<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5"
    />
    <meta name="theme-color" content="#f4f1e8" />
    <meta name="color-scheme" content="dark light" />

    <!-- Default SEO (overridden per-page by react-helmet-async) -->
    <title>Shiprion | Global Logistics Platform</title>
    <meta
      name="description"
      content="Shiprion — enterprise logistics platform for air, road, and ocean freight across 180+ countries. AI-optimized routing and real-time tracking."
    />
    <meta name="robots" content="index, follow" />

    <!-- Default Open Graph -->
    <meta property="og:site_name" content="Shiprion" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://shiprion.com/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Default Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@shiprion" />
    <meta name="twitter:image" content="https://shiprion.com/opengraph.jpg" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Preload LCP hero image -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-truck-3d.png"
      fetchpriority="high"
      type="image/png"
    />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
