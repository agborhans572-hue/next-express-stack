name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shiprion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shiprion_test
      SESSION_SECRET: ci-session-secret-that-is-longer-than-thirty-two-characters
      APP_ORIGIN: http://localhost:5173
      PORT: 8080
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @workspace/db migrate
      - run: corepack pnpm --filter @workspace/api-spec codegen
      - run: corepack pnpm run ci
      - run: corepack pnpm audit --prod --audit-level high
      - run: corepack pnpm exec playwright install --with-deps chromium
      - name: Start private object-storage test service
        run: |
          python -m pip install 'moto[server,s3]==5.2.3'
          moto_server -H 0.0.0.0 -p 9000 >/tmp/shiprion-moto.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/moto-api/; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/shiprion-moto.log
              exit 1
            fi
            sleep 1
          done
          python -c "import boto3; boto3.client('s3', endpoint_url='http://127.0.0.1:9000', aws_access_key_id='shiprion-e2e', aws_secret_access_key='shiprion-minio-password', region_name='us-east-1').create_bucket(Bucket='shiprion-e2e')"
      - name: Browser workflows
        run: corepack pnpm run test:e2e
        env:
          E2E_FULL: "true"
          E2E_BASE_URL: http://127.0.0.1:5173
          SEED_ADMIN_EMAIL: admin@example.com
          SEED_ADMIN_PASSWORD: Admin-E2E-Password!1
          SEED_CUSTOMER_PASSWORD: Customer-E2E-Password!1
          S3_BUCKET: shiprion-e2e
          S3_REGION: us-east-1
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_ACCESS_KEY_ID: shiprion-e2e
          S3_SECRET_ACCESS_KEY: shiprion-minio-password
          S3_FORCE_PATH_STYLE: "true"
