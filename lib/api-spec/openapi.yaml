        estimatedDelivery: { type: string, format: date }
      required: [recipientName, recipientAddress]

    Notification:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string }
        message: { type: string }
        href: { type: [string, "null"] }
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, type, title, message, href, readAt, createdAt]

    NotificationPage:
      type: object
      properties:
        items:
          { type: array, items: { $ref: "#/components/schemas/Notification" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        unread: { type: integer }
      required: [items, page, pageSize, total, unread]

    PresignUploadBody:
      type: object
      properties:
        shipmentId: { type: integer }
        fileName: { type: string, maxLength: 180 }
        contentType:
          {
            type: string,
            enum: [image/jpeg, image/png, image/webp, application/pdf],
          }
        size: { type: integer, minimum: 1, maximum: 10485760 }
      required: [shipmentId, fileName, contentType, size]

    CreateProofBody:
      type: object
      properties:
        recipientName: { type: string, minLength: 2, maxLength: 120 }
        deliveredAt: { type: string, format: date-time }
        notes: { type: string, maxLength: 2000 }
        objectKey: { type: string }
        originalFileName: { type: string }
        contentType:
          {
            type: string,
            enum: [image/jpeg, image/png, image/webp, application/pdf],
          }
        fileSize: { type: integer, minimum: 1, maximum: 10485760 }
      required:
        [
          recipientName,
          deliveredAt,
          objectKey,
          originalFileName,
          contentType,
          fileSize,
        ]
