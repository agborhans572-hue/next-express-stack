    SubmitQuoteBody:
      type: object
      properties:
        serviceCode: { type: string }
        contactName: { type: string, minLength: 2, maxLength: 120 }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string, maxLength: 40 }
        origin: { type: string, minLength: 2, maxLength: 200 }
        destination: { type: string, minLength: 2, maxLength: 200 }
        cargoType: { type: string, minLength: 2, maxLength: 100 }
        weightKg: { type: number, exclusiveMinimum: 0 }
