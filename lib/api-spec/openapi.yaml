      required: [session, guestToken, guestTokenExpiresAt]

    PublicTrackingEvent:
      type: object
      description: >
        A tracking event as returned by the unauthenticated public endpoint.
        Coordinates (latitude/longitude) are intentionally omitted to prevent
        precise location intel from being accessible without authentication.
        Delivery-stage location strings are coarsened to destination city/country.
      properties:
        id:
          type: integer
        shipmentId:
          type: integer
        location:
          type: string
        status:
          type: string
        description:
          type: string
        occurredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        [id, shipmentId, location, status, description, occurredAt, createdAt]

    ShipmentWithTracking:
      type: object
      description: >
        Public shipment tracking data. Intentionally omits recipient identity
        and precise location coordinates to protect recipient privacy.
      properties:
        id:
          type: integer
        trackingNumber:
          type: string
        origin:
          type: string
        destination:
          type: string
        status:
          type: string
          enum:
            [
              registered,
              pending,
              picked_up,
              in_transit,
              customs,
              on_hold_customs,
              arrived_at_port,
              out_for_delivery,
              delivered,
              cancelled,
            ]
        weightKg:
          type: ["number", "null"]
        estimatedDelivery:
          type: ["string", "null"]
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        events:
          type: array
          items:
            $ref: "#/components/schemas/PublicTrackingEvent"
      required:
        - id
        - trackingNumber
        - origin
        - destination
        - status
        - weightKg
        - estimatedDelivery
        - createdAt
        - updatedAt
        - events

    UpdateProfileBody:
      type: object
      properties:
        fullName: { type: [string, "null"], minLength: 2, maxLength: 120 }
        phone: { type: [string, "null"], maxLength: 40 }
        company: { type: [string, "null"], maxLength: 160 }

    ServiceRate:
