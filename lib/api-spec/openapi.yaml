          }
        validUntil: { type: [string, "null"], format: date-time }
        convertedShipmentId: { type: [integer, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        [
          id,
          reference,
          customerId,
          contactName,
          contactEmail,
          contactPhone,
          origin,
          destination,
          cargoType,
          weightKg,
          serviceRateId,
          estimatedPriceCents,
          finalPriceCents,
          currency,
          status,
          validUntil,
          convertedShipmentId,
          createdAt,
          updatedAt,
        ]

    QuotePage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Quote" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
